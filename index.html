<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euler Theorem Prover</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 900px; }
    textarea, select, button { width: 100%; margin-top: 0.5rem; margin-bottom: 1rem; }
    textarea { min-height: 80px; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Euler Theorem Prover</h1>
  <label for="input">Input theorem</label>
  <textarea id="input">sum i from 1 to n of (i+2)^2</textarea>

  <label for="method">Choose method</label>
  <select id="method">
    <option>Euler-Maclaurin</option>
    <option>Integration approximation</option>
    <option>Known formula expansion</option>
    <option>Split polynomial terms</option>
    <option>Compare methods</option>
  </select>

  <button id="prove">Prove</button>

  <h2>Closed form output</h2>
  <pre id="closed"></pre>

  <h2>Formal proof steps</h2>
  <pre id="steps"></pre>

  <h2>Child explanation</h2>
  <pre id="child"></pre>

  <h2>Optional staircase diagram</h2>
  <pre id="diagram"></pre>

  <script src="app.js"></script>
</body>
</html>
