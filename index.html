<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euler Web Theorem Prover</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.6rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
    section { margin-top: 1.5rem; }
    h2 { font-size: 1.1rem; border-bottom: 1px solid #ccc; padding-bottom: 0.2rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; border-radius: 4px; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Euler Web Theorem Prover</h1>
    <p class="hint">Enter a theorem name: <code>sum_first_n</code>, <code>sum_squares</code>, or <code>sum_cubes</code>.</p>
    <label for="theorem-input">Theorem</label>
    <input id="theorem-input" name="theorem" type="text" placeholder="sum_first_n">
    <button id="prove-button" type="button">Prove</button>
    <section aria-live="polite">
      <h2>Proof trace</h2>
      <pre id="proof-output">Enter a theorem name above and click Prove.</pre>
    </section>
    <section aria-live="polite">
      <h2>Simplification</h2>
      <pre id="simplify-output"></pre>
    </section>
    <section aria-live="polite">
      <h2>Child-friendly explanation</h2>
      <pre id="explanation-output"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
